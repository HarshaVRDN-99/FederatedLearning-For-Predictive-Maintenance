[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rulfl"
version = "0.1.0"
description = "Federated RUL prediction under label skew (C-MAPSS FD004): FedAvg vs FedProx vs FedLA"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
